version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parcels
      POSTGRES_USER: parcels
      # Local dev default; override for anything shared: POSTGRES_PASSWORD=... docker compose up -d
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parcels}
    ports:
      # Bind to loopback only so the dev database isn't exposed on the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - parcels_data:/var/lib/postgresql/data

volumes:
  parcels_data:
